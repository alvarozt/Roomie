/* ROOMIE · línea gráfica del plan de Dirección Comercial 2026
   Layout: páginas claras sobre "Papel", paneles oscuros "Noche" y tarjetas blancas redondeadas,
   igual que la pantalla de la app del PowerPoint. Un solo tema (el de la marca). */
:root{
  color-scheme: light;
  --papel:#F7F2F5; --papel-2:#F6EFF3; --blanco:#FFFFFF;
  --noche:#1E1620; --noche-2:#2C2230; --noche-3:#3A3040;
  --malva:#B0618D; --malva-ink:#964B76; --rosa:#E7AFCD; --rosa-2:#F3DDE9; --azul:#4F81BD; --azul-ink:#3F6FA8;
  --texto:#1E1620; --texto-2:#4E4352; --texto-3:#6A5E6E; --mute:#8F8292;
  --linea:#E6DAE1; --linea-2:#DDD2D8;
  --ok:#2E7D5B; --aviso:#A9651A; --error:#B3324A;
  --f-titulo:"Outfit","DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-texto:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sombra:0 1px 2px rgba(30,22,32,.04),0 8px 24px rgba(30,22,32,.06);
  --ancho:1120px;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--papel);color:var(--texto);font-family:var(--f-texto);font-size:16px;line-height:1.55}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-titulo);font-weight:600;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.25rem)}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
h3{font-size:1.3rem}
h4{font-size:1.05rem}
p{margin:0}
a{color:var(--malva-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--ancho);margin:0 auto;padding:0 20px}
.eyebrow{font-family:var(--f-texto);font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--malva-ink)}
.lead{font-size:1.1rem;color:var(--texto-2);max-width:62ch}
.muted{color:var(--texto-3)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- cabecera ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(247,242,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:var(--ancho);margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--texto);font-family:var(--f-titulo);font-weight:600;font-size:1.3rem;flex:none}
.brand svg{width:30px;height:30px}
.nav{display:flex;gap:6px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:2px}
.nav::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid var(--linea-2);background:var(--blanco);color:var(--texto);text-decoration:none;font-size:.95rem;font-weight:500;cursor:pointer}
.pill:hover{border-color:var(--mute)}
.pill.on{background:var(--noche);border-color:var(--noche);color:#fff}
.top-act{display:flex;gap:8px;align-items:center;flex:none}
.ico-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--linea-2);background:var(--blanco);display:grid;place-items:center;cursor:pointer;color:var(--texto);text-decoration:none}
.ico-btn:hover{border-color:var(--mute)}
.ico-btn svg{width:19px;height:19px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--malva);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-titulo);background:linear-gradient(135deg,var(--azul),var(--rosa) 55%,var(--malva));flex:none;border:0;cursor:pointer;text-decoration:none}
.avatar.lg{width:64px;height:64px;font-size:1.5rem}
.avatar.sm{width:32px;height:32px;font-size:.85rem}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid var(--noche);background:var(--noche);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--noche-3)}
.btn.malva{background:var(--malva-ink);border-color:var(--malva-ink)}
.btn.malva:hover{background:#823f66}
.btn.ghost{background:transparent;color:var(--texto);border-color:var(--linea-2)}
.btn.ghost:hover{background:var(--blanco);border-color:var(--mute)}
.btn.claro{background:#fff;color:var(--noche);border-color:#fff}
.btn.claro:hover{background:var(--rosa-2)}
.btn.borde-claro{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.btn.sm{padding:8px 14px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;color:var(--malva-ink);text-decoration:underline;cursor:pointer}

/* ---------- secciones ---------- */
main{display:block;min-height:60vh}
.sec{padding:56px 0}
.sec.tight{padding:32px 0}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--blanco);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:10px}
.card.tope{border-top:3px solid var(--malva)}
.card.tope.azul{border-top-color:var(--azul)}
.card .ico{width:30px;height:30px;color:var(--malva)}
.card.azul .ico{color:var(--azul)}
.card p{color:var(--texto-2)}
.panel-noche{background:var(--noche);color:#fff;border-radius:var(--r-xl);padding:36px}
.panel-noche .muted{color:#BCAFB9}
.panel-noche .eyebrow{color:var(--rosa)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:var(--blanco);border:1px solid var(--linea);font-size:.9rem;white-space:nowrap}
.chip.dark{background:var(--noche-2);border-color:var(--noche-3);color:#fff}
.chip.malva{background:var(--rosa-2);border-color:var(--rosa);color:#6d2f55}
.chip.azul{background:#E4EDF7;border-color:#BCD0E8;color:#2c507c}
.chip.ok{background:#E1F1EA;border-color:#B9DCCB;color:#1f5c42}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- portada ---------- */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;background:#3a2236 var(--img-cover) center/108% auto no-repeat;color:#fff;padding:clamp(28px,5vw,60px);display:flex;flex-direction:column;gap:22px;min-height:440px;justify-content:space-between}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,32,.35),rgba(30,22,32,0) 45%,rgba(30,22,32,.45));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-brand{display:flex;align-items:center;gap:16px;font-family:var(--f-titulo);font-size:clamp(3rem,9vw,6.2rem);font-weight:500;line-height:1;letter-spacing:-.02em}
.hero-brand svg{width:.82em;height:.82em;flex:none}
.hero h1{font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:500;max-width:18ch}
.hero p{max-width:52ch;color:#F3E6EE}
.hero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.18);color:#fff;font-size:1rem;padding:8px 18px}
.spark{position:absolute;right:clamp(20px,6vw,70px);top:clamp(24px,6vw,70px);width:clamp(40px,7vw,78px);z-index:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-titulo);font-size:2.4rem;font-weight:500;line-height:1}
.stat b span{color:var(--mute);font-weight:400}
.steps{counter-reset:paso}
.step{position:relative;padding-left:58px}
.step::before{counter-increment:paso;content:"0" counter(paso);position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;background:var(--rosa-2);color:var(--malva-ink);display:grid;place-items:center;font-family:var(--f-titulo);font-weight:600}

/* ---------- tablas ---------- */
.tabla-wrap{overflow-x:auto;border-radius:var(--r-lg);background:var(--blanco);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--linea);vertical-align:top}
thead th{font-family:var(--f-titulo);font-weight:600;background:var(--papel-2)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody th{font-weight:600;width:28%}
td.si{color:var(--ok);font-weight:600}
td.no{color:var(--mute)}
td.dest,th.dest{background:#FBF6F9}

/* ---------- planes ---------- */
.plan{position:relative;gap:14px}
.plan.dest{outline:2px solid var(--malva)}
.plan .precio{font-family:var(--f-titulo);font-size:2.3rem;font-weight:500;line-height:1}
.plan .precio small{font-size:1rem;color:var(--texto-3);font-weight:400}
.plan ul,.lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.plan li,.lista li{position:relative;padding-left:24px;color:var(--texto-2)}
.plan li::before,.lista li::before{content:"";position:absolute;left:2px;top:.5em;width:12px;height:7px;border-left:2px solid var(--malva);border-bottom:2px solid var(--malva);transform:rotate(-45deg)}
.plan .cta{margin-top:auto;padding-top:8px}
.etq{position:absolute;top:-12px;right:20px;background:var(--malva-ink);color:#fff;font-size:.75rem;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:999px;text-transform:uppercase}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;margin:0}
.ficha dt{color:var(--texto-3)}
.ficha dd{margin:0;font-weight:500}

/* ---------- blog / texto largo ---------- */
.post-card{text-decoration:none;color:inherit;overflow:hidden;padding:0}
.post-card .portada{height:150px;background:var(--noche) var(--img-z1) center/cover}
.post-card.b .portada{background-image:var(--img-z2)}
.post-card.c .portada{background-image:var(--img-z3)}
.post-card .cuerpo{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px}
.post-card:hover h3{color:var(--malva-ink)}
.prosa{max-width:70ch;display:flex;flex-direction:column;gap:16px}
.prosa h2{font-size:1.5rem;margin-top:14px}
.prosa h3{font-size:1.15rem;margin-top:6px}
.prosa p,.prosa li{color:var(--texto-2)}
.prosa ul,.prosa ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.nota{background:var(--rosa-2);border-left:4px solid var(--malva);border-radius:var(--r-sm);padding:14px 18px;color:#4a2a3d}
.nota.azul{background:#E4EDF7;border-left-color:var(--azul);color:#24405f}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--texto-3)}

/* ---------- formularios ---------- */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.etiqueta{font-weight:600;font-size:.92rem}
.campo input,.campo select,.campo textarea,.inp{border:1px solid var(--linea-2);background:var(--blanco);border-radius:var(--r-sm);padding:11px 13px;width:100%}
.campo textarea{min-height:110px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.inp:focus{outline:2px solid var(--azul);outline-offset:0;border-color:var(--azul)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--texto-2)}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--malva-ink);flex:none}
.err{color:var(--error);font-size:.88rem;font-weight:500}
.okmsg{background:#E1F1EA;border:1px solid #B9DCCB;color:#1f5c42;border-radius:var(--r-sm);padding:12px 16px}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.op{padding:9px 15px;border-radius:999px;border:1px solid var(--linea-2);background:var(--blanco);cursor:pointer;font-size:.93rem}
.op:hover{border-color:var(--mute)}
.op.on{background:var(--noche);border-color:var(--noche);color:#fff}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.escala .op{border-radius:var(--r-sm);text-align:center;padding:10px 4px;display:flex;flex-direction:column;gap:2px;align-items:center}
.escala .op b{font-family:var(--f-titulo);font-size:1.2rem}
.escala .op span{font-size:.72rem;line-height:1.2;opacity:.8}
.progreso{height:8px;border-radius:999px;background:var(--linea);overflow:hidden}
.progreso i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--malva),var(--rosa))}

/* ---------- carrito ---------- */
.linea-carro{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--linea)}
.cant{display:inline-flex;align-items:center;border:1px solid var(--linea-2);border-radius:999px;overflow:hidden;background:#fff}
.cant button{width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:1.1rem}
.cant span{min-width:26px;text-align:center}
.totales{display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.totales .tot{font-family:var(--f-titulo);font-size:1.4rem;font-weight:600}
.pago{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

<p>Dividid las tareas en tantos bloques como personas haya en el piso. Para un piso de tres, por ejemplo:</p>

<li><strong>Bloque A:</strong> cocina (encimera, vitro, suelo) y basura.</li>
<li><strong>Bloque B:</strong> baño completo.</li>

function noLeidos() { return Object.keys(S.unread).reduce((t, id) => t + (perfil(id) ? S.unread[id] : 0), 0); }
function visitasPropuestas() { return Object.values(S.chats).reduce((t, m) => t + m.filter((x) => x.tipo === 'visita').length, 0); }
function candidatos() { const m = PERFILES.filter(enMisZonas); return m.length ? m : PERFILES; }
function chipsDe(ans, fem) {
  const tab = [fem ? 'No fumadora' : 'Piso sin humo', fem ? 'No fumadora' : 'No fuma', 'Fuma fuera', 'Fuma en casa'][ans.q7];
  const mas = ['Sin mascotas', 'Le gustan las mascotas', 'Con mascota'][ans.q8];
  const hor = ans.q3 <= 2 ? 'Madruga' : ans.q3 >= 4 ? 'Nocturno/a' : 'Horario medio';
  return ['Limpieza ' + ans.q1 + '/5', tab, mas, hor];
}
function perfilCompleto() {
  const u = S.user; let ok = 0; const total = 14;
  [u.name, u.age, u.sit, u.zones.length, u.budget, u.entrada, u.mates].forEach((v) => { if (v) ok++; });
  ok += Math.round(Object.keys(u.ans).length / 2); // 10 respuestas = 5 puntos
  if (u.bio) ok++; if (u.verified) ok++;
  return Math.round(100 * ok / total);
}

/* ---------- carrito ---------- */
const prod = (id) => PRODUCTOS.find((p) => p.id === id);
function carroLineas() { return Object.keys(S.cart).map((id) => ({ p: prod(id), n: S.cart[id] })).filter((l) => l.p); }
function carroN() { return carroLineas().reduce((t, l) => t + l.n, 0); }
function carroTotales() {
  const sub = carroLineas().reduce((t, l) => t + l.p.precio * l.n, 0);
  const desc = S.promo ? Math.round(sub * 10) / 100 : 0;
  const total = Math.round((sub - desc) * 100) / 100;
  const base = Math.round(total / (1 + CONFIG.iva) * 100) / 100;
  return { sub, desc, total, base, iva: Math.round((total - base) * 100) / 100 };
}

function barrasCompat(vals) {
  // distribución en campana, como en el diseño: grises a los lados, malva en el centro
  const c = [];
  vals.slice().sort((a, b) => b - a).forEach((v, i) => { if (i % 2) c.push(v); else c.unshift(v); });
  const lo = Math.min.apply(null, vals) - 8, hi = Math.max.apply(null, vals), w = 6, g = 3;

function listaPerfiles() {
  const f = ui.filtros, plus = S.plan === 'plus', u = S.user;
  let l = PERFILES.map((p) => ({ p, v: pct(p) }));
  if (f.ciudad) l = l.filter((x) => x.p.c === f.ciudad);
  if (f.max) l = l.filter((x) => x.p.p <= f.max);
  if (f.min) l = l.filter((x) => x.v >= f.min);
  if (plus) {
    if (f.humo) l = l.filter((x) => x.p.a.q7 <= 1);
    if (f.mascotas) l = l.filter((x) => x.p.a.q8 >= 1);
    if (f.horario) l = l.filter((x) => Math.abs(x.p.a.q3 - u.ans.q3) <= 1);

  l.sort((a, b) => f.orden === 'precio' ? a.p.p - b.p.p : f.orden === 'nuevos' ? (b.p.nuevo - a.p.nuevo) || (b.v - a.v) : b.v - a.v);

}

const CACHE_CONT = 'roomie-contenido-v1', SES_ADMIN = 'roomie-admin';

const clon = (o) => JSON.parse(JSON.stringify(o));
function contenidoActual() {
  const config = {}; CLAVES_CONFIG.forEach((k) => { config[k] = CONFIG[k]; });
  return clon({ config, gratis: GRATIS, productos: PRODUCTOS, posts: POSTS.map((p) => ({ id: p.id, titulo: p.titulo, fecha: p.fecha, min: p.min, cat: p.cat, extracto: p.extracto, html: p.html })), perfiles: PERFILES });

const txt = (v, d) => (typeof v === 'string' ? v : d);
const num = (v, d, min, max) => { const n = Number(v); return isFinite(n) && n >= min && n <= max ? n : d; };
const lineas = (v, d) => (Array.isArray(v) ? v.map(String).map((x) => x.trim()).filter(Boolean) : d);

function aplicarContenido(o) {
  if (!o || typeof o !== 'object') return;
  const c = o.config || {};
  CLAVES_CONFIG.forEach((k) => {
    if (c[k] === undefined) return;
    if (k === 'hashtags') CONFIG[k] = lineas(c[k], CONFIG[k]);
    else if (k === 'contactosGratis') CONFIG[k] = Math.round(num(c[k], CONFIG[k], 1, 99));
    else if (k === 'instagram' || k === 'tiktok') { if (/^https:\/\//.test(c[k])) CONFIG[k] = c[k]; }
    else CONFIG[k] = txt(c[k], CONFIG[k]);
  });
  CONFIG.codigoPromo = String(CONFIG.codigoPromo).trim().toUpperCase() || 'ROOMIE10';
  if (o.gratis) { GRATIS.nombre = txt(o.gratis.nombre, GRATIS.nombre); GRATIS.resumen = txt(o.gratis.resumen, GRATIS.resumen); GRATIS.incluye = lineas(o.gratis.incluye, GRATIS.incluye); }

    p.nombre = txt(n.nombre, p.nombre); p.tipo = txt(n.tipo, p.tipo); p.resumen = txt(n.resumen, p.resumen); p.desc = txt(n.desc, p.desc);
    p.precio = Math.round(num(n.precio, p.precio, 0, 999) * 100) / 100; p.incluye = lineas(n.incluye, p.incluye);
  });
  if (Array.isArray(o.posts)) {
    const ok = o.posts.filter((p) => p && /^blog-[a-z0-9-]+$/.test(p.id) && txt(p.titulo, '').trim()).map((p) => ({ id: p.id, titulo: p.titulo.trim(), fecha: txt(p.fecha, ''), min: Math.round(num(p.min, 5, 1, 60)), cat: txt(p.cat, 'Blog'), extracto: txt(p.extracto, ''), html: txt(p.html, '') }));
    POSTS.splice(0, POSTS.length, ...ok); registrarPosts();
  }
  if (Array.isArray(o.perfiles)) {
    const ok = o.perfiles.filter((p) => p && /^[a-z0-9-]+$/.test(p.id) && txt(p.n, '').trim() && CIUDADES[p.c] && CIUDADES[p.c].indexOf(p.z) >= 0 && p.a).map((p) => {
      const a = {}; PREGUNTAS.forEach((q) => { a[q.id] = Math.round(q.esc ? num(p.a[q.id], 3, 1, 5) : num(p.a[q.id], 1, 0, q.ops.length - 1)); });

    });

  }
}

/* ---------- Supabase por REST (sin librerías) ---------- */
const hayBackend = () => /^https:\/\/.+/.test(SUPABASE.url) && !!SUPABASE.key;
function cabeceras(token) {
  const h = { apikey: SUPABASE.key, 'Content-Type': 'application/json' };
  // Las claves nuevas (sb_publishable_) van solo en "apikey"; las antiguas (JWT) también en Authorization.
  if (token) h.Authorization = 'Bearer ' + token; else if (SUPABASE.key.indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + SUPABASE.key;
  return h;
}
const base = () => SUPABASE.url.replace(/\/+$/, '');
async function leerRemoto() {
  const r = await fetch(base() + '/rest/v1/contenido?id=eq.web&select=datos', { headers: cabeceras() });
  if (!r.ok) throw new Error('lectura ' + r.status);
  const f = await r.json(); return f.length ? f[0].datos : null;
}
async function entrarAdmin(email, password) {
  const r = await fetch(base() + '/auth/v1/token?grant_type=password', { method: 'POST', headers: cabeceras(), body: JSON.stringify({ email, password }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error(r.status === 400 ? 'Correo o contraseña incorrectos.' : 'No se ha podido iniciar sesión (error ' + r.status + ').');
  return { token: j.access_token, email, exp: Date.now() + (j.expires_in || 3600) * 1000 };
}
async function guardarRemoto(datos, token) {
  const r = await fetch(base() + '/rest/v1/contenido', { method: 'POST', headers: Object.assign(cabeceras(token), { Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify({ id: 'web', datos, actualizado: new Date().toISOString() }) });
  if (r.status === 401) throw new Error('Tu sesión ha caducado. Vuelve a entrar.');
  if (r.status === 403) throw new Error('Este usuario no tiene permiso de administrador. Revisa el correo de las políticas SQL.');
  if (!r.ok) throw new Error('No se ha podido guardar (error ' + r.status + ').');
}

  'adm-perfil'() { const a = {}; PREGUNTAS.forEach((q) => { a[q.id] = q.esc ? 3 : 1; }); adm.draft.perfiles.unshift({ id: 'p-' + uid(), n: 'Nuevo perfil', e: 21, c: 'Salamanca', z: 'Centro', s: 'Estudiante', que: '', p: 280, m: 'Septiembre', nuevo: 1, ver: 0, bio: '', a }); adm.sucio = true; pintar(); },
  'adm-quitar'(el) { const l = adm.draft[el.dataset.l]; if (el.dataset.l === 'perfiles' && l.length <= 1) { toast('La app necesita al menos un perfil'); return; } l.splice(+el.dataset.i, 1); adm.sucio = true; pintar(); },
  'adm-descartar'() { adm.draft = contenidoActual(); adm.sucio = false; adm.err = ''; adm.msg = 'Cambios descartados.'; pintar(); },
  'adm-original'() { adm.draft = clon(ORIGINAL); adm.sucio = true; adm.err = ''; adm.msg = 'Contenido original cargado. Pulsa «Guardar y publicar» para aplicarlo.'; pintar(); },
  'adm-salir'() { adm.ses = null; adm.draft = null; adm.sucio = false; try { sessionStorage.removeItem(SES_ADMIN); } catch (e) { /* */ } pintar(true); },
  async 'adm-guardar'() {
    const d = adm.draft, malo = d.posts.find((p) => !String(p.titulo).trim()) ? 'Hay una entrada del blog sin título.' : d.perfiles.find((p) => !String(p.n).trim()) ? 'Hay un perfil sin nombre.' : d.productos.find((p) => !(Number(p.precio) >= 0) || p.precio === '') ? 'Revisa los precios: deben ser números de 0 en adelante.' : '';
    if (malo) { adm.err = malo; pintar(); return; }
    adm.ocupado = true; adm.err = ''; pintar();
    try {
      await guardarRemoto(d, adm.ses.token);
      aplicarContenido(d); try { localStorage.setItem(CACHE_CONT, JSON.stringify(d)); } catch (e) { /* */ }
      adm.draft = contenidoActual(); adm.sucio = false; adm.msg = 'Publicado a las ' + hora(Date.now()) + '. Ya lo ven todos los visitantes.';
    } catch (e) { adm.err = e.message || 'No se ha podido guardar. Comprueba tu conexión.'; if (/caducado/.test(adm.err)) { adm.ses = null; try { sessionStorage.removeItem(SES_ADMIN); } catch (x) { /* */ } } }
    adm.ocupado = false; pintar();
  }
});
F_['admin-login'] = async function (f) {
  const email = f.email.value.trim(), pass = f.pass.value;
  if (!email || !pass) { adm.err = 'Escribe tu correo y tu contraseña.'; pintar(); return; }
  adm.ocupado = true; adm.err = ''; pintar();
  try { adm.ses = await entrarAdmin(email, pass); try { sessionStorage.setItem(SES_ADMIN, JSON.stringify(adm.ses)); } catch (e) { /* */ } adm.draft = null; adm.msg = ''; }
  catch (e) { adm.err = e.message === 'Failed to fetch' ? 'No hay conexión con Supabase. Revisa la URL del proyecto.' : e.message; }
  adm.ocupado = false; pintar();
};

/* ---------- arranque ---------- */
try { const c = JSON.parse(localStorage.getItem(CACHE_CONT) || 'null'); if (c) aplicarContenido(c); } catch (e) { /* */ }
ui.ruta = rutaActual();
pintar();
if (hayBackend()) leerRemoto().then((datos) => {
  if (!datos) return;
  aplicarContenido(datos); try { localStorage.setItem(CACHE_CONT, JSON.stringify(datos)); } catch (e) { /* */ }
  const a = document.activeElement, escribiendo = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  let h = ''; try { h = location.hash.replace('#', ''); } catch (e) { /* */ }
  if (h && VISTAS[h]) ui.ruta = h; else if (!VISTAS[ui.ruta]) ui.ruta = 'inicio';
  if (ui.ruta !== 'admin' && !escribiendo && !ui.modal) pintar();
}).catch(() => { /* sin conexión: se queda el contenido guardado u original */ });
